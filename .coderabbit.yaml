# CodeRabbit — configuração de review (expxdev)
# Schema: https://docs.coderabbit.ai/reference/configuration
#
# Revisão automática DESLIGADA desde 2026-09-20 (ver reviews.auto_review): a
# review da nuvem só roda por disparo manual (`@coderabbitai review`).
language: 'pt-BR'
early_access: false

reviews:
  profile: 'assertive'
  request_changes_workflow: true
  high_level_summary: true
  review_status: true
  poem: false
  collapse_walkthrough: false

  # Revisão automática só na ABERTURA do PR (ou quando um rascunho vira "pronto
  # para revisão"). Os commits seguintes não disparam nova revisão: comente
  # `@coderabbitai review` (só o que mudou) ou `@coderabbitai full review` (tudo).
  # PR de documentação não é revisado sozinho quando o título tem `docs:` ou `docs(`.
  # Atenção: o CodeRabbit procura o trecho em QUALQUER parte do título, não só no
  # começo (não existe filtro por prefixo). Use esses trechos só como prefixo de
  # PR de documentação. O disparo manual continua valendo em qualquer PR.
  # Cota compartilhada do AxisGov: 1 revisão automática por hora para a organização
  # inteira. Se dois PRs abrirem na mesma hora, o segundo pode precisar do manual.
  auto_review:
    # DESLIGADO em 2026-09-20, decisão do Flávio. Motivo medido no painel
    # (app.coderabbit.ai/dashboard/review-capacity), últimos 7 dias: 400 eventos
    # de revisão, 318 BLOQUEADOS por limite, 67 entregues. A cota é de 1 revisão
    # por hora para a organização AxisGov INTEIRA (14 repositórios na mesma fila),
    # e revisão bloqueada é perdida, não fica na fila. Com o disparo na abertura,
    # a revisão caía no PR ainda vazio. Agora a revisão é pedida à mão com
    # `@coderabbitai review`, só em PR que vale a cota (critério no PR que
    # desligou). Check verde do CodeRabbit sem pedido = "nada foi pedido", não
    # "foi lido e nada achou". Não religue sem nova medição do painel.
    # As chaves abaixo ficam como registro; só têm efeito com enabled: true.
    enabled: false
    auto_incremental_review: false
    drafts: false
    ignore_title_keywords:
      - 'docs:'
      - 'docs('

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

  path_filters:
    - '!**/package-lock.json'
    - '!**/pnpm-lock.yaml'
    - '!**/yarn.lock'
    - '!**/node_modules/**'
    - '!**/dist/**'
